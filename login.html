<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Назар Сизько</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<form class="login-form" action="https://httpbin.org/post" method="post">
    <h1>Вход</h1>
    <p class="login-hint">Введите логин и пароль, чтобы продолжить</p>

    <div class="field">
        <label for="login">Логин</label>
        <input type="text" id="login" name="login" autocomplete="username" required>
    </div>

    <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>

    <label class="checkbox">
        <input type="checkbox" name="remember" value="yes">
        <span>Запомнить меня</span>
    </label>

    <button type="submit">Войти</button>

    <a href="index.html" class="back-link">← На главную</a>
</form>

</body>
</html>
